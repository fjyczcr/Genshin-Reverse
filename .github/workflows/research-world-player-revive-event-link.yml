name: Research 7.1 world player revive event link

on:
  push:
    branches:
      - research/world-player-revive
    paths:
      - '.github/workflows/research-world-player-revive-event-link.yml'

permissions:
  contents: read

jobs:
  link-response-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch pinned exact 7.1 Global samples
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Scan revive request-state owners for response callback slots
        run: |
          python - <<'PY'
          import bisect
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, CS_OP_MEM, Cs

          from genshinre.pe import PEImage

          root = Path('versions/7.1.0-global/windows-x64')
          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          methods_path = root / 'metadata/methods.csv'

          # These offsets are taken from the success path of the seven exact
          # one-int32 candidate handlers whose bodies are minimal retcode+callback dispatchers.
          response_event_offsets = {
              0x274F78: {'cmd_id': 4761, 'message_type': 'CHPMLJLBLCB', 'handler_rva': '0xC227720'},
              0x2752C0: {'cmd_id': 7003, 'message_type': 'GFPMFMJPNMA', 'handler_rva': '0xC241960'},
              0x2753D0: {'cmd_id': 8223, 'message_type': 'LOGPEGIEACK', 'handler_rva': '0xC244030'},
              0x275770: {'cmd_id': 9129, 'message_type': 'INDKHBFONJA', 'handler_rva': '0xC2538A0'},
              0x275600: {'cmd_id': 22904, 'message_type': 'MOKBJEHGENJ', 'handler_rva': '0xC25D710'},
              0x275EB8: {'cmd_id': 23684, 'message_type': 'JMMBKLEPMMC', 'handler_rva': '0xC256150'},
              0x275368: {'cmd_id': 24380, 'message_type': 'HIADLALFEFD', 'handler_rva': '0xC2433E0'},
          }
          revive_owner_types = {
              'EDKMMIPJHJA', 'BMMDCOLHAOE', 'KKJPPPLJAAG',
              'AGHDHMPNDMC', 'AGLDLBEJKHP'
          }

          methods = []
          with methods_path.open(encoding='utf-8', newline='') as f:
              for row in csv.DictReader(f):
                  rva_text = row.get('rva')
                  if not rva_text:
                      continue
                  try:
                      rva = int(rva_text, 0)
                  except ValueError:
                      continue
                  item = dict(row)
                  item['_rva'] = rva
                  methods.append(item)
          methods.sort(key=lambda x: x['_rva'])
          starts = [m['_rva'] for m in methods]

          by_owner = defaultdict(list)
          for m in methods:
              if m.get('type_name') in revive_owner_types:
                  by_owner[m['type_name']].append(m)

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          hits = []
          scanned = []

          with PEImage(exe) as image:
              image_base = image.image_base
              for owner in sorted(revive_owner_types):
                  for m in by_owner.get(owner, []):
                      start = m['_rva']
                      pos = bisect.bisect_right(starts, start)
                      next_start = starts[pos] if pos < len(starts) else start + 0x400
                      size = max(0x20, min(next_start - start, 0x2000))
                      code = image.read_rva(start, size)
                      scanned.append({'type_name': owner, 'method_name': m.get('method_name'), 'rva': m.get('rva'), 'size': size})
                      for insn in md.disasm(code, image_base + start):
                          for op in insn.operands:
                              if op.type != CS_OP_MEM:
                                  continue
                              disp = int(op.mem.disp)
                              if disp not in response_event_offsets:
                                  continue
                              hits.append({
                                  'candidate': response_event_offsets[disp],
                                  'event_offset': f'0x{disp:X}',
                                  'owner_type': owner,
                                  'owner_method': m.get('method_name'),
                                  'owner_method_rva': m.get('rva'),
                                  'site_rva': f'0x{insn.address - image_base:X}',
                                  'instruction': f'{insn.mnemonic} {insn.op_str}'.strip(),
                              })

          result = {
              'schema': 'genshin-revive-response-event-link-v1',
              'response_event_offsets': {f'0x{k:X}': v for k, v in response_event_offsets.items()},
              'revive_owner_types': sorted(revive_owner_types),
              'scanned_method_count': len(scanned),
              'hits': hits,
              'interpretation_gate': 'A hit links an exact response-handler success callback displacement to a type independently proven to construct/send WorldPlayerReviveReq 5232. Inspect the owning method around the hit before semantic promotion.'
          }
          Path('revive-response-event-link.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'scanned_method_count': len(scanned), 'hits': hits}, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: revive-response-event-link
          path: revive-response-event-link.json
          if-no-files-found: error
          retention-days: 7
